<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracker Krisis Bumi - NASA API & OSM</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9534f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="https://flaticon.com">

  <!-- Pustaka Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #121212; color: #e0e0e0; }
    .container { max-width: 1200px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #d9534f; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #d9534f; margin: 0; font-size: 24px; }
    p { color: #aaa; font-size: 15px; }
    .badge { background: #d9534f; color: white; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    #peta { width: 100%; height: 600px; border-radius: 8px; border: 1px solid #333; background: #262626; }
    #status { margin-top: 15px; font-size: 14px; font-weight: bold; color: #f0ad4e; }
    .install-btn { display: none; background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .leaflet-popup-content-wrapper { background: #2a2a2a !important; color: #fff !important; border-radius: 8px !important; }
    .leaflet-popup-tip { background: #2a2a2a !important; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌍 Live Tracker Krisis Planet Bumi (NASA EONET & OSM)</h1>
    <div>
      <button id="btnInstall" class="install-btn">Pasang Aplikasi (PWA)</button>
      <span class="badge">Satelit Real-Time</span>
    </div>
  </div>
  <p>Sistem memetakan kebakaran hutan, aktivitas vulkanik, dan badai cuaca ekstrem di dunia dari satelit NASA di atas OpenStreetMap.</p>
  <div id="peta"></div>
  <div id="status">Menghubungkan ke pusat data satelit NASA EONET...</div>
</div>

<script>
  // PWA Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    });
  }

  // Map Setup (OSM Dark Mode)
  const map = L.map('peta').setView([0, 0], 2);
  L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors © CARTO | NASA EONET'
  }).addTo(map);

  // Fetch NASA API
  fetch("https://eonet.gsfc.nasa.gov/api/v3/events?status=open")
    .then(res => res.json())
    .then(data => {
      const statusBox = document.getElementById("status");
      if (data.events && data.events.length > 0) {
        let count = 0;
        data.events.forEach(event => {
          // Perbaikan parsing array geometry agar tidak error kosong
          if (event.geometry && event.geometry.length > 0) {
            const latestGeo = event.geometry[0]; 
            if (latestGeo.coordinates && latestGeo.coordinates.length >= 2) {
              const lon = latestGeo.coordinates[0];
              const lat = latestGeo.coordinates[1];
              const date = new Date(latestGeo.date).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
              
              const categoryTitle = (event.categories && event.categories.length > 0) ? event.categories[0].title : "Bencana";
              const sourceUrl = (event.sources && event.sources.length > 0) ? event.sources[0].url : "#";

              const info = `
                <div style="font-family: sans-serif; min-width: 180px;">
                  <h4 style="margin:0 0 6px 0; color:#d9534f;">🚨 ${event.title}</h4>
                  <span style="font-size:12px; color:#ccc;"><b>Kategori:</b> ${categoryTitle}</span><br>
                  <span style="font-size:12px; color:#ccc;"><b>Terdeteksi:</b> ${date}</span><br>
                  <a href="${sourceUrl}" target="_blank" style="display:block; text-align:center; background:#5cb85c; color:white; padding:5px; margin-top:10px; border-radius:4px; font-size:11px; text-decoration:none; font-weight:bold;">Sumber NASA</a>
                </div>
              `;
              L.marker([lat, lon]).addTo(map).bindPopup(info);
              count++;
            }
          }
        });
        statusBox.innerHTML = `<span style="color:#5cb85c;">✅ Berhasil memetakan ${count} lokasi bencana global aktif.</span>`;
      } else {
        statusBox.innerHTML = "Tidak ada bencana aktif saat ini.";
      }
    })
    .catch(err => {
      document.getElementById("status").innerHTML = "<span style='color:#d9534f;'>❌ Gagal memuat data satelit NASA.</span>";
    });

  // PWA Install Button Logic
  let deferredPrompt;
  const btnInstall = document.getElementById('btnInstall');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    btnInstall.style.display = 'inline-block';
  });
  btnInstall.addEventListener('click', () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choice) => {
        if (choice.outcome === 'accepted') btnInstall.style.display = 'none';
        deferredPrompt = null;
      });
    }
  });
</script>
</body>
</html>
